[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nosql-migration-tool"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = ["fastapi==0.116.1", "uvicorn[standard]==0.35.0", "pymongo==4.13.2", "pydantic==2.11.7", "pydantic-settings==2.10.1", "sqlglot==27.8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
